---
name: Build EVE image
description: Build and export an EVE image for a given arch/hv/platform

inputs:
  arch:
    required: true
  platform:
    required: true
  hv:
    required: true
  cache-artifact:
    required: true
    description: "Name of the linuxkit cache artifact to download"
  cover:
    description: "'y' to build pillar/EVE with Go coverage instrumentation (COVER=y)"
    required: false
    default: ''
  image-repo:
    description: "Repository the exported image is tagged under (see 'Set environment' below)."
    required: false
    default: 'evebuild/pr'

outputs:
  version:
    description: "Version the EVE image was built with, which its tag carries."
    value: ${{ steps.set-env.outputs.version }}

runs:
  using: composite
  steps:
    - name: Login to Docker Hub
      if: ${{ github.event.repository.full_name == 'lf-edge/eve' }}
      shell: bash
      run: |
        docker login
    - name: Download linuxkit cache
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: ${{ inputs.cache-artifact }}
        path: ~/.linuxkit/cache
    - name: Build packages for ${{ inputs.platform }}
      shell: bash
      run: |
        make V=1 PRUNE=1 PLATFORM=${{ inputs.platform }} ZARCH=${{ inputs.arch }} HV=${{ inputs.hv }} \
          COVER=${{ inputs.cover }} pkgs
    - name: Load tool images into docker
      shell: bash
      run: |
        make cache-export-docker-load-all
    - name: Set environment
      id: set-env
      shell: bash
      env:
        PR_ID: ${{ github.event.pull_request.number || github.run_id }}
      run: |
        COMMIT_ID=$(git describe --abbrev=8 --always)
        VERSION="0.0.0-pr$PR_ID-$COMMIT_ID"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "TAG=${{ inputs.image-repo }}:$PR_ID" >> $GITHUB_ENV
        echo "VERSIONED_TAG=${{ inputs.image-repo }}:$VERSION" >> $GITHUB_ENV
    - name: Build EVE ${{ inputs.hv }}-${{ inputs.arch }}-${{ inputs.platform }}
      shell: bash
      run: |
        make V=1 ROOTFS_VERSION="$VERSION" PLATFORM=${{ inputs.platform }} \
          HV=${{ inputs.hv }} ZARCH=${{ inputs.arch }} COVER=${{ inputs.cover }} eve
    # build.yml's sbom-maps job checks these against the license and supplier
    # maps, and the update scripts read them when the check fails.
    - name: Upload SBoM
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
      with:
        name: sbom-${{ inputs.hv }}-${{ inputs.arch }}-${{ inputs.platform }}
        path: dist/${{ inputs.arch }}/${{ steps.set-env.outputs.version }}/installer/rootfs-${{ inputs.platform }}.spdx.json
        if-no-files-found: error
    - name: Post build report
      shell: bash
      run: |
        df -h && free -m
        docker system df -v
    - name: Export docker container
      shell: bash
      run: |
        make cache-export ZARCH=${{ inputs.arch }} \
          IMAGE=lfedge/eve:$VERSION-${{ inputs.hv }} \
          OUTFILE=eve-${{ inputs.hv }}-${{ inputs.arch }}-${{ inputs.platform }}.tar \
          IMAGE_NAME=$TAG-${{ inputs.hv }}-${{ inputs.arch }}
    # Also tag the image with its build version: the PR-number tag repeats across
    # pushes, so the evetest broker, which caches images by name, would test a
    # stale build. linuxkit exports a single name, hence the manifest edit.
    # TODO: drop this step and the PR-number tag once Eden is gone (it cuts tags
    # at the first '-', hence not compatible with the version tag).
    - name: Add the per-build version tag to the exported image
      shell: bash
      run: |
        python3 "${GITHUB_ACTION_PATH}/add_repo_tag.py" \
          eve-${{ inputs.hv }}-${{ inputs.arch }}-${{ inputs.platform }}.tar \
          "$VERSIONED_TAG-${{ inputs.hv }}-${{ inputs.arch }}"
    # evetest-pr.yml names the image to stage on the brokers from this, before
    # it downloads anything.
    - name: Upload EVE version
      shell: bash
      run: echo "$VERSION" > eve-version.txt
    - name: Upload EVE version artifact
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
      with:
        name: eve-version-${{ inputs.hv }}-${{ inputs.arch }}-${{ inputs.platform }}
        path: eve-version.txt
    - name: Upload EVE image
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
      with:
        name: eve-${{ inputs.hv }}-${{ inputs.arch }}-${{ inputs.platform }}
        path: eve-${{ inputs.hv }}-${{ inputs.arch }}-${{ inputs.platform }}.tar
    - name: Clean
      if: always()
      shell: bash
      run: |
        make clean
        docker system prune -f -a --volumes
        rm -rf ~/.linuxkit
