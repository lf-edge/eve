---
name: Rerun CI

on:  # yamllint disable-line rule:truthy
  issue_comment:
    types: [created]

permissions: {}

jobs:
  rerun-workflows:
    if: |
      github.event.issue.pull_request && startsWith(github.event.comment.body, '/evetest')
    runs-on: ubuntu-latest
    timeout-minutes: 1440

    permissions:
      actions: write
      issues: read
      pull-requests: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Parse CODEOWNERS to get allowed users
        run: |
          CODEOWNERS=".github/CODEOWNERS"
          awk '{for(i=1;i<=NF;i++) if($i ~ /^@/) print substr($i,2)}' "$CODEOWNERS" | sort -u > allowed_users.txt

      - name: Check if comment author is allowed
        env:
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          echo "User: $COMMENT_USER"
          if ! grep -Fxq "$COMMENT_USER" allowed_users.txt; then
            echo "User $COMMENT_USER is not allowed to rerun CI." >&2
            exit 1
          fi

      - name: Gather PR branch and SHA
        id: prinfo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName -q .headRefName)
          SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid)
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      # "/evetest [all | <name> ...]": re-run the PR Gate, which finds the
      # comment, decides whether evetest may start (build done, and approved
      # or requested by a CODEOWNER) and triggers evetest-pr.yml. The gate run
      # is found through the "Ready for evetest" commit status, whose target
      # is always the gate run (see pr-gate.yml and evetest-pr.yml).
      - name: Rerun the PR Gate for this PR's latest commit (evetest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.prinfo.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          STATUS_URL=$(gh api "repos/$REPO/commits/$SHA/statuses" \
              --jq '[.[] | select(.context == "Ready for evetest") | select(.target_url | test("/actions/runs/"))][0].target_url // ""')
          GATE_RUN="${STATUS_URL##*/}"
          if [ -z "$GATE_RUN" ]; then
            echo "::error::No PR Gate run found for commit $SHA (has the PR build run yet?)"
            exit 1
          fi
          echo "Re-running PR Gate run $GATE_RUN"
          gh run rerun "$GATE_RUN" --repo "$REPO"
