          docker system prune --all --force --volumes
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/build-eve
        with:
          arch: amd64
          platform: generic
          hv: k
          cache-artifact: linuxkit-cache-amd64-generic

  eve-amd64-k-ai-generic:
    name: "eve (amd64, k, ai-generic)"
    needs: pkgs-amd64-generic
    runs-on: zededa-ubuntu-2204
    timeout-minutes: 1440
    steps:
      - name: Clear repository
        shell: bash
        run: |
          sudo rm -fr "$GITHUB_WORKSPACE" && mkdir "$GITHUB_WORKSPACE"
          rm -fr ~/.linuxkit
          docker system prune --all --force --volumes
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/build-eve
        with:
          arch: amd64
          platform: ai-generic
          hv: k
          cache-artifact: linuxkit-cache-amd64-generic

  # ── arm64 generic ──

  eve-arm64-kvm-generic:
    name: "eve (arm64, kvm, generic)"
    needs: pkgs-arm64-generic
    runs-on: zededa-ubuntu-2204-arm64
    timeout-minutes: 1440
    steps:
      - name: Clear repository
        shell: bash
        run: |
          sudo rm -fr "$GITHUB_WORKSPACE" && mkdir "$GITHUB_WORKSPACE"
          rm -fr ~/.linuxkit
          docker system prune --all --force --volumes
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/build-eve
        with:
          arch: arm64
          platform: generic
          hv: kvm
          cache-artifact: linuxkit-cache-arm64-generic

  eve-arm64-k-generic:
    name: "eve (arm64, k, generic)"
    needs: pkgs-arm64-generic
    runs-on: zededa-ubuntu-2204-arm64
    timeout-minutes: 1440
    steps:
      - name: Clear repository
        shell: bash
        run: |
          sudo rm -fr "$GITHUB_WORKSPACE" && mkdir "$GITHUB_WORKSPACE"
          rm -fr ~/.linuxkit
          docker system prune --all --force --volumes
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/build-eve
        with:
