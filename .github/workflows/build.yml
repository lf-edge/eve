---
name: PR build
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - "master"
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+-stable"
      - "feature/*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The build and some tests clone from github.com (linuxkit, swtpm, ...).
  # GitHub throttles anonymous fetches per source IP, which makes those clones
  # fail in bursts on the shared self-hosted runners, so authenticate every
  # github.com clone this job makes.
  GITHUB_TOKEN: ${{ github.token }}
  GIT_ASKPASS: ${{ github.workspace }}/tools/github-askpass.sh

jobs:
  changes:
    uses: ./.github/workflows/pr-paths.yml
    permissions:
      pull-requests: read
    with:
      match: '.'
      ignore: '^\.github/|\.md$'

  # ════════════════════════════════════════════════════════════════════════
  # Stage 1: Build base packages and upload linuxkit cache as artifacts.
  # All stage-2 jobs download the cache so `make pkgs` is mostly a no-op,
  # only building any extra platform/HV-specific packages on top.
  # ════════════════════════════════════════════════════════════════════════

  pkgs-amd64-generic:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: zededa-ubuntu-2204
    timeout-minutes: 1440
    steps:
      - name: Starting Report
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Git Ref: ${HEAD_REF}"
          echo GitHub Event: ${{ github.event_name }}
          echo "Build target: pkgs amd64 generic"
          df -h && free -m
      - name: Clear repository
        run: |
          sudo rm -fr "$GITHUB_WORKSPACE" && mkdir "$GITHUB_WORKSPACE"
          rm -fr ~/.linuxkit
          docker system prune --all --force --volumes
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Login to Docker Hub
        if: ${{ github.event.repository.full_name == 'lf-edge/eve' }}
        run: |
          docker login
      - name: Build packages
        run: |
          make V=1 PRUNE=1 PLATFORM=generic ZARCH=amd64 HV=kvm pkgs
      - name: Upload linuxkit cache
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: linuxkit-cache-amd64-generic
          path: ~/.linuxkit/cache
          retention-days: 1
      - name: Post package report
        run: |
          df -h && free -m
          docker system df -v
      - name: Clean
        if: ${{ always() }}
        run: |
          make clean
          docker system prune -f -a --volumes
          rm -rf ~/.linuxkit

  pkgs-arm64-generic:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: zededa-ubuntu-2204-arm64
    timeout-minutes: 1440
    steps:
      - name: Starting Report
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Git Ref: ${HEAD_REF}"
          echo GitHub Event: ${{ github.event_name }}
          echo "Build target: pkgs arm64 generic"
          df -h && free -m
      - name: Clear repository
        run: |
          sudo rm -fr "$GITHUB_WORKSPACE" && mkdir "$GITHUB_WORKSPACE"
          rm -fr ~/.linuxkit
          docker system prune --all --force --volumes
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Login to Docker Hub
        if: ${{ github.event.repository.full_name == 'lf-edge/eve' }}
        run: |
          docker login
      - name: Build packages
        run: |
          make V=1 PRUNE=1 PLATFORM=generic ZARCH=arm64 HV=kvm pkgs
      - name: Upload linuxkit cache
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: linuxkit-cache-arm64-generic
          path: ~/.linuxkit/cache
          retention-days: 1
      - name: Post package report
        run: |
          df -h && free -m
          docker system df -v
      - name: Clean
        if: ${{ always() }}
        run: |
          make clean
          docker system prune -f -a --volumes
          rm -rf ~/.linuxkit

  # ════════════════════════════════════════════════════════════════════════
  # Stage 2: Build EVE images using reusable workflow.
  # Each job downloads the base cache, builds any extra packages for its
  # platform/HV, then builds and exports the EVE image.
  # ════════════════════════════════════════════════════════════════════════

  # ── amd64 generic ──

  eve-amd64-kvm-generic:
    name: "eve (amd64, kvm, generic)"
    needs: pkgs-amd64-generic
    runs-on: zededa-ubuntu-2204
    timeout-minutes: 1440
    steps:
      - name: Clear repository
        shell: bash
        run: |
          sudo rm -fr "$GITHUB_WORKSPACE" && mkdir "$GITHUB_WORKSPACE"
          rm -fr ~/.linuxkit
          docker system prune --all --force --volumes
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/build-eve
        with:
          arch: amd64
          platform: generic
          hv: kvm
          cache-artifact: linuxkit-cache-amd64-generic

  # ── amd64 rt ──

  eve-amd64-kvm-rt:
