      - uses: ./.github/actions/build-eve
        with:
          arch: arm64
          platform: nvidia-jp7
          hv: k
          cache-artifact: linuxkit-cache-arm64-generic

  result:
    name: PR build result
    if: always()
    needs:
      - changes
      - pkgs-amd64-generic
      - pkgs-arm64-generic
      - eve-amd64-kvm-generic
      - eve-amd64-kvm-rt
      - eve-amd64-k-generic
      - eve-amd64-k-ai-generic
      - eve-arm64-kvm-generic
      - eve-arm64-k-generic
      - eve-arm64-kvm-nvidia-jp5
      - eve-arm64-kvm-nvidia-jp6
      - eve-arm64-kvm-nvidia-jp7
      - eve-arm64-k-nvidia-jp6
      - eve-arm64-k-nvidia-jp7
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
