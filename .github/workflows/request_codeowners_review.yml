---
name: Request Code Owners Review

# Runs after "PR Event" (opened, pushed to, reopened, ready for review):
# requesting reviewers needs a token that can write, which a pull_request
# run on a fork does not get, and GitHub blocks pull_request_target on
# public repositories. Nothing from the triggering run is trusted; the PR
# is looked up again by its head commit, and CODEOWNERS is read from the
# PR's base branch.
on:  # yamllint disable-line rule:truthy
  workflow_run:
    workflows: ["PR Event"]
    types: [completed]

permissions: {}

jobs:
  auto_request_review:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Find the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # workflow_run.pull_requests is empty for fork PRs
          pr=$(gh api -X GET "repos/$REPO/pulls" -f state=open \
                 -f head="$HEAD_OWNER:$HEAD_BRANCH" |
               jq -c --arg sha "$HEAD_SHA" \
                 '[.[] | select(.head.sha == $sha)][0] // empty')
          if [ -z "$pr" ]; then
            echo "No open PR has $HEAD_SHA as its head"
            exit 0
          fi
          jq -r '"number=\(.number)", "author=\(.user.login)",
                 "base_ref=\(.base.ref)", "base_sha=\(.base.sha)",
                 "head_sha=\(.head.sha)"' <<<"$pr" >> "$GITHUB_OUTPUT"

      # Commits and trees only, and only CODEOWNERS in the worktree: the
      # diff below needs the history, not the files.
      - name: Checkout code
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ steps.pr.outputs.base_ref }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/CODEOWNERS
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Auto request review
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch -q origin "$HEAD_SHA"
          mapfile -t changed_files < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "PR #$PR_NUMBER changes ${#changed_files[@]} files"

          # Every line whose pattern prefixes a changed file adds its
          # owners. Matching stays in bash: a PR can change thousands of
          # files, and a process per file and line took up to 50 minutes.
          patterns=()
          owners=()
          while read -r pattern rest; do
            [[ -z "$pattern" || "$pattern" == \#* ]] && continue
            patterns+=("${pattern#/}")
            owners+=("$rest")
          done < .github/CODEOWNERS
          declare -A reviewers=()
          for i in "${!patterns[@]}"; do
            for changed_file in "${changed_files[@]}"; do
              # shellcheck disable=SC2053 # the pattern is a glob on purpose
              if [[ "${changed_file#/}" == ${patterns[$i]}* ]]; then
                echo "Found owners for ${patterns[$i]}: ${owners[$i]}"
                read -ra line_owners <<< "${owners[$i]//@/}"
                for owner in "${line_owners[@]}"; do
                  reviewers[$owner]=1
                done
                break
              fi
            done
          done
          unset "reviewers[$PR_AUTHOR]"

          if [ ${#reviewers[@]} -gt 0 ]; then
            echo "Requesting review from: ${!reviewers[*]}"
            # A refused request (e.g. an owner without access) is not fatal
            printf '%s\n' "${!reviewers[@]}" |
              jq -R . | jq -s '{reviewers: .}' |
              gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
                --input - --jq '[.requested_reviewers[].login] | join(" ")' ||
              echo "::warning::GitHub refused the review request"
          else
            echo "No reviewers found for the changed files."
          fi
