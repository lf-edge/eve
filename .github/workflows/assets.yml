---
name: Release Assets
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      tag_ref:
        required: true
        type: string
      # Build the files from the images this run pushed by digest, listed in
      # its sign-images-eve-* artifacts, into a draft release, and hand each
      # sha256sums file to release-sign.yml as a sign-blobs-assets-*
      # artifact. Otherwise build from the release tags into a published
      # pre-release.
      draft:
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_PULL_TOKEN:
        required: true
      DOCKERHUB_PULL_USER:
        required: true
    outputs:
      release_id:
        description: the release the files were uploaded to
        value: ${{ jobs.create_release.outputs.release_id }}
      upload_url:
        description: its asset upload URL
        value: ${{ jobs.create_release.outputs.upload_url }}

permissions: {}

env:
  # The build and some tests clone from github.com (linuxkit, swtpm, ...).
  # GitHub throttles anonymous fetches per source IP, which makes those clones
  # fail in bursts on the shared self-hosted runners, so authenticate every
  # github.com clone this job makes.
  GITHUB_TOKEN: ${{ github.token }}
  GIT_ASKPASS: ${{ github.workspace }}/tools/github-askpass.sh

jobs:
  create_release:
    runs-on: zededa-ubuntu-2204
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create GitHub Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_REF: ${{ inputs.tag_ref }}
          REPO: ${{ github.repository }}
          DRAFT: ${{ inputs.draft }}
        run: |
          payload=$(jq -n --arg tag "$TAG_REF" --argjson draft "$DRAFT" \
            '{tag_name: $tag, name: $tag, draft: $draft, prerelease: true}')
          response=$(curl -s --show-error -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://api.github.com/repos/$REPO/releases")
          release_id=$(echo "$response" | jq -r '.id // empty')
          upload_url=$(echo "$response" | jq -r '.upload_url // empty' | sed -e "s/{?name,label}//")
          if [ -z "$release_id" ] || [ -z "$upload_url" ]; then
            echo "::error::Creating release $TAG_REF failed: $response"
            exit 1
          fi
          echo "$upload_url"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "upload_url=$upload_url" >> "$GITHUB_OUTPUT"
  build:
    runs-on: zededa-ubuntu-2204
    needs: create_release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        platform: ["generic"]
        hv: ["kvm"]
        include:
          - arch: arm64
            platform: "nvidia-jp5"
            hv: "kvm"
          - arch: arm64
            platform: "nvidia-jp6"
            hv: "kvm"
          - arch: arm64
            platform: "nvidia-jp7"
            hv: "kvm"
          - arch: amd64
            platform: "generic"
            hv: "k"
          - arch: arm64
            platform: "generic"
            hv: "k"
          - arch: arm64
            platform: "nvidia-jp5"
            hv: "k"
          - arch: arm64
            platform: "nvidia-jp6"
            hv: "k"
          - arch: arm64
            platform: "nvidia-jp7"
            hv: "k"
    steps:
      # The tag fetch below runs against github.com, so the GITHUB_TOKEN must
      # stay in .git/config; anonymous git is subject to GitHub's rate limits.
      - name: checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 # zizmor: ignore[artipacked]
        with:
          ref: ${{ inputs.tag_ref }}
          fetch-depth: 0
      - name: Force fetch annotated tags (workaround)
        # Workaround for https://github.com/actions/checkout/issues/290
        run: |
          git fetch --force --tags
      - name: Determine architecture prefix and ref
        env:
          REF: ${{ inputs.tag_ref }}
        run: |
          echo "ARCH=${{ matrix.arch }}" >> "$GITHUB_ENV"
          if [ "${{ matrix.platform }}" != "generic" ]; then
             echo "PLATFORMVER=${{ matrix.platform }}-" >> "$GITHUB_ENV"
          else
             echo "PLATFORMVER=" >> "$GITHUB_ENV"
          fi
          echo "TAG=$(git describe --always --tags | grep -E '[0-9]+\.[0-9]+\.[0-9]' || echo snapshot)" >> "$GITHUB_ENV"
      - name: Ensure clean assets directory
        run: |
          rm -rf assets && mkdir -p assets
      - name: Login to Docker Hub
        if: github.event.repository.full_name == 'lf-edge/eve'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_PULL_USER }}
          password: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
      - name: Download the pushed digests
        if: inputs.draft
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sign-images-eve-${{ matrix.arch }}-${{ matrix.hv }}-${{ matrix.platform }}
          path: pushed
      - name: Pull the EVE release from DockerHUB or build it
        env:
          DRAFT: ${{ inputs.draft }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          HV=${{ matrix.hv }}
          if [ "$DRAFT" = true ]; then
             # shellcheck disable=SC1090
             . "pushed/release-$ARCH-$HV-$PLATFORM.env"
             docker pull "$EVE"
             echo "EVE_SOURCES=$EVE_SOURCES" >> "$GITHUB_ENV"
          elif [ "${{ github.event.repository.full_name }}" = "lf-edge/eve" ]; then
             EVE=lfedge/eve:${TAG}-${{ env.PLATFORMVER }}${HV}-${{ env.ARCH }}
             docker pull "$EVE"
          else
             make pkgs
             make HV=${HV} ZARCH=${{ env.ARCH }} PLATFORM=${{ matrix.platform }} eve
             EVE=lfedge/eve:$(make version)-${{ env.PLATFORMVER }}${HV}-${{ env.ARCH }}
          fi
          echo "EVE=$EVE" >> "$GITHUB_ENV"
      - name: Generate EVE binary assets
        # The image streams each asset to stdout. Without --log-driver none the
        # daemon also journals that stream, JSON-escaped, under
        # /var/lib/docker/containers, which for the ~28 GiB live image can
        # fill the runner's disk; --rm drops each container's scratch copy.
        run: |
          gen() {
            docker run --rm --log-driver none "$EVE" "$1" > "assets/$2"
            if [ ! -s "assets/$2" ]; then
              echo "::error::'$1' produced an empty assets/$2"
              exit 1
            fi
          }
          gen installer_raw installer.raw
          gen rootfs rootfs.img
          gen live live.raw
          gen sbom rootfs.spdx.json
          if [ "${{ matrix.platform }}" == "generic" ]; then
             gen installer_iso installer.iso
             gen installer_net installer-net.tar
          fi
      - name: Export eve-sources to assets/collected_sources.tar
        env:
          DRAFT: ${{ inputs.draft }}
        run: |
          HV=${{ matrix.hv }}
          EVE_SOURCES=${EVE_SOURCES:-lfedge/eve-sources:${TAG}-${{ env.PLATFORMVER }}${HV}-${{ env.ARCH }}}
          docker pull "$EVE_SOURCES"
          # The signed sha256sums then also binds the image digests the
          # files came from.
          if [ "$DRAFT" = true ]; then
             printf '%s\n%s\n' "$EVE" "$EVE_SOURCES" > assets/images.txt
          fi
          docker create --name eve_sources "$EVE_SOURCES" bash
          docker export --output assets/collected_sources.tar eve_sources
          docker rm eve_sources
      - name: Compress large assets with zstd
        # installer.raw, live.raw, and collected_sources.tar can exceed the
        # GitHub release asset size limit (2 GiB). These compress extremely
        # well (raw disk images typically 5-20x for sparse regions), keeping
        # them well under the limit and reducing transfer time.
        run: |
          for file in assets/*.raw assets/collected_sources.tar; do
            [ -e "$file" ] || continue
            zstd -T0 --rm -q --long=30 "$file"
          done
      - name: Rename, create SHA256 checksums and upload files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create_release.outputs.release_id }}
          UPLOAD_URL: ${{ needs.create_release.outputs.upload_url }}
        run: |
          # Rename all files
          HV=${{ matrix.hv }}
          for file in assets/*; do
            base_name=$(basename "$file")
            # Add ARCH + platform prefix
            new_name="${ARCH}.${HV}.${{ matrix.platform }}.${base_name}"
            # Rename the file
            mv "$file" "assets/$new_name"
          done
          # Create sha256sums file and summary of file sizes
          sha256_file="${ARCH}.${HV}.${{ matrix.platform }}.sha256sums"
          sizes_file="${ARCH}.${HV}.${{ matrix.platform }}.sizes"
          cd assets/
          sha256sum * > "../$sha256_file"
          du -b * > "../$sizes_file"
          cd ../
          mv "$sha256_file" assets/
          mv "$sizes_file" assets/
          mkdir -p sums
          cp "assets/$sha256_file" sums/
          # Upload files. Track failures and fail the job at the end so that
          # all assets are attempted before the run is marked failed.
          upload_failed=0
          for file in assets/*; do
            file_name=$(basename $file)
            echo "Uploading ${file_name}..."
            # The assignment sits inside the `if` so that a curl exit code does
            # not trip `bash -e` and abandon the assets queued behind this one.
            if upload_response=$(curl -s --show-error -X POST \
                 -H "Authorization: Bearer $GITHUB_TOKEN" \
                 -H "Content-Type: application/octet-stream" \
                 -T "$file" \
                 "$UPLOAD_URL?name=$file_name") \
               && echo "$upload_response" | jq -e .id > /dev/null; then
              echo "$file_name uploaded successfully."
            else
              echo "::error::Failed to upload $file_name: $upload_response"
              upload_failed=1
            fi
          done
          exit "$upload_failed"
      - name: Hand the sums to release-sign.yml
        if: inputs.draft
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: sign-blobs-assets-${{ matrix.arch }}-${{ matrix.hv }}-${{ matrix.platform }}
          path: sums
