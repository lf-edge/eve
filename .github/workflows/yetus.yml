---
name: Apache Yetus
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - "master"
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+-stable"

jobs:
  yetus:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: src
          fetch-depth: 0

      - name: Generate patch locally
        working-directory: src
        run: |
          # Add upstream and fetch the base branch
          git remote add upstream ${{ github.server_url }}/${{ github.repository }}.git
          git fetch upstream ${{ github.base_ref }}
          # Now diff against the correct base
          git diff upstream/${{ github.base_ref }}...HEAD > ${{ github.workspace }}/pr.patch
          # Get back to upstream master so patch can be applied
          git checkout upstream/${{ github.base_ref }} -b ${{ github.base_ref }}
          git submodule update --init --recursive

      - name: Prepare gitconfig for container
        run: |
          cat > /tmp/gitconfig <<'EOF'
          [safe]
              directory = *
          EOF

      - name: Yetus
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v /tmp/gitconfig:/etc/gitconfig \
            lfedge/eve-yetus:0.15.1-eve-2 \
            test-patch \
            --basedir=/workspace/src \
            --patch-dir=/workspace/out \
            --build-tool=nobuild \
            --continuous-improvement=true \
            --plugins='all,-asflicense,-author,-findbugs,-gitlab,-jira,-shelldocs' \
            --revive-config=.revive.toml \
            --brief-report-file=/workspace/out/brief.txt \
            --console-report-file=/workspace/out/console.txt \
            --html-report-file=/workspace/out/report.html \
            --junit-report-xml=/workspace/out/junit-report.xml \
            --pylint-requirements=true \
            --report-unknown-options=false \
            /workspace/pr.patch

      - name: Store Yetus artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: 'yetus-scan'
          path: ${{ github.workspace }}/out

      - name: Publish Yetus vote table in the job summary
        if: ${{ always() }}
        run: |
          console=${{ github.workspace }}/out/console.txt
          if [ ! -s "${console}" ]; then
            echo "No Yetus report to publish."
            exit 0
          fi
          {
            echo '```'
            cat "${console}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Annotate errors from Yetus
        if: ${{ always() }}
        run: |
          # Yetus collects the issues a patch *adds* - the ones it posts as
          # inline review comments when it has PR access - into results-full.txt,
          # one per line as file:line:column:plugin:message. This is the only
          # output scoped to the patch: the branch-*/patch-*-result.txt files it
          # derives that from are scans of the whole tree, so annotating those
          # buries the patch's own issues under pre-existing ones.
          results=${{ github.workspace }}/out/results-full.txt
          if [ ! -s "${results}" ]; then
            echo "No new issues to annotate."
            exit 0
          fi
          while IFS=: read -r file lineno column plugin message; do
            case "${lineno}" in
              ''|*[!0-9]*)
                echo "${file}:${lineno}:${column}:${plugin}:${message}"
                continue
              ;;
            esac
            case "${column}" in
              ''|0|*[!0-9]*) col='' ;;
              *) col=",col=${column}" ;;
            esac
            echo "::error file=${file},line=${lineno}${col},title=Yetus [${plugin}]::${message}"
          done < "${results}"
