//
// EVE packages name every package they need explicitly, like they did with
// apk: dependencies only, never recommends or suggests. The mirror holds the
// Depends closure only, so a recommended package would not be found anyway.
APT::Install-Recommends "0";
APT::Install-Suggests "0";
APT::Get::Assume-Yes "true";
Acquire::Languages "none";
