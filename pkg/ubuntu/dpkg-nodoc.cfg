#
# Keep /out small: no documentation, manual pages or translations. The
# machine-readable copyright files stay, syft reads the package licenses from
# them for the SBOM.
path-exclude=/usr/share/doc/*
path-include=/usr/share/doc/*/copyright
path-exclude=/usr/share/man/*
path-exclude=/usr/share/info/*
path-exclude=/usr/share/locale/*
path-exclude=/usr/share/lintian/*
path-exclude=/usr/share/bash-completion/*
path-exclude=/usr/share/zsh/*
path-exclude=/usr/share/fish/*
path-exclude=/usr/share/vim/*/doc/*
