apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      # kube-init labels a node while nvidia.ko is loaded and an NVIDIA CDI
      # spec is present; without them the pod could never start.
      nodeSelector:
        eve.lfedge.org/nvidia-gpu: "true"
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      # Mark this pod as a critical add-on; when enabled, the critical add-on
      # scheduler reserves resources for critical add-on pods so that they can
      # be rescheduled after a failure.
      # See https://kubernetes.io/docs/tasks/administer-cluster/guaranteed-scheduling-critical-addon-pods/
      priorityClassName: "system-node-critical"
      containers:
      - image: nvcr.io/nvidia/k8s-device-plugin:v0.20.0
        name: nvidia-device-plugin-ctr
        env:
        - name: NVIDIA_DRIVER_ROOT
          value: /opt/vendor/nvidia/dist
        - name: NVIDIA_DEV_ROOT
          value: /
        - name: DEVICE_DISCOVERY_STRATEGY
          value: nvml
        - name: NVIDIA_CTK_PATH
          value: /opt/vendor/nvidia/bin/nvidia-ctk
        - name: CONTAINER_DRIVER_ROOT
          value: /opt/vendor/nvidia/dist
        securityContext:
          privileged: true
        volumeMounts:
        - name: kubelet-device-plugins-dir
          mountPath: /var/lib/kubelet/device-plugins
        - name: nvidia-driver-root
          mountPath: /opt/vendor/nvidia/dist
          readOnly: true
        - name: dev
          mountPath: /dev
        - name: cdi-root
          mountPath: /var/run/cdi
      volumes:
      - name: kubelet-device-plugins-dir
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: Directory
      - name: nvidia-driver-root
        hostPath:
          path: /opt/vendor/nvidia/dist
          type: Directory
      - name: dev
        hostPath:
          path: /dev
      - name: cdi-root
        hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
