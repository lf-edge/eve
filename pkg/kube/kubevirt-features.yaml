---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  configuration:
    permittedHostDevices:
      # Explicit empty arrays — the CRD schema requires arrays, and
      # bare keys parse as `null` which server-side apply rejects.
      pciHostDevices: []   # <- PCIe passthrough devices like nvme drives/NIC
      mediatedDevices: []  # <- GPUs
      usb: []              # <- USB passthrough
    developerConfiguration:
      featureGates:
        - HostDisk
        - Snapshot
        - HostDevices
        - GPU
        - VideoConfig
        - CPUManager
