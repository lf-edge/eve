# Inform the DHCP server of our hostname for DDNS.
hostname

# Use a link-layer DUID for DHCPv6. A DUID-LLT embeds the time it was
# created, and /var/lib/dhcpcd does not survive a reboot.
# Must precede clientid, which keeps the hardware address as the DHCPv4
# Client ID instead of the RFC4361 DUID + IAID.
duid ll
# Use the hardware address of the interface for the Client ID.
clientid

# Persist interface configuration when dhcpcd exits.
persistent

# Rapid commit support.
# Safe to enable by default because it requires the equivalent option set
# on the server to actually work.
option rapid_commit

# A list of options to request from the DHCP server.
option domain_name_servers, domain_name, domain_search, host_name
option classless_static_routes
# Most distributions have NTP support.
option ntp_servers
# Respect the network MTU. This is applied to DHCP routes.
option interface_mtu

# A ServerID is required by RFC2131.
require dhcp_server_identifier

# Do not send a vendorid since linuxkit can confuse servers
vendorclassid

# Use EUI-64 interface identifiers. RFC7217 stable private addresses need
# the secret in /var/lib/dhcpcd, which does not survive a reboot.
slaac hwaddr

# Do not wait
nodelay

# Do not arp to check IP
noarp

# wait for ipv4 address
waitip 4

# send logs to syslog
debug
