org: lfedge
image: eve-pillar
config:
  binds:
    - /lib/modules:/lib/modules
    - /dev:/dev
    - /etc/resolv.conf:/etc/resolv.conf
    - /etc/cdi:/etc/cdi
    - /run:/run
    - /config:/config
    - /:/hostfs
    - /persist:/persist:rshared,rbind
    - /usr/bin/containerd:/usr/bin/containerd
    - /opt/vendor:/opt/vendor:ro
    # the host's cgroup tree: the user containerd creates /eve-user-apps/<task>
    # and joins /eve/containerd, pillar adjusts cpusets and reads accounting
    - /sys/fs/cgroup:/sys/fs/cgroup:rshared,rbind,rw
    # Expose host firmware for Wi-Fi drivers that defer firmware loading
    # until first interface use, from within the container context.
    - /lib/firmware:/lib/firmware
  capabilities:
    - all
  pid: host
  rootfsPropagation: shared
  devices:
    - path: all
      type: a
buildArgs:
  - RSTATS=y
  - RSTATS_TAG=pillar
  - RSTATS_ENDPOINT=localhost:8125
